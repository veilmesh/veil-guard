# Cross-platform binaries for a tagged release.
#
# This runs on the GitHub push-mirror rather than on the canonical GitLab repo,
# for one reason: the npm wrapper and the GitHub Action both shell out to a
# `veil-guard` binary, so releases have to cover macOS and Windows, and GitLab
# SaaS offers no free runners for either. Everything else — lint, test, the
# cross-language conformance run — lives in `.gitlab-ci.yml` and gates merges
# there.
#
# Tag the canonical repo, let the mirror carry the tag across, and this builds.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl rather than glibc: the binary is copied into whatever container a
          # user's CI happens to run, and a glibc build breaks on Alpine.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install toolchain
        run: rustup target add ${{ matrix.target }}

      - name: Install musl tooling
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The auditor is included: a released binary that cannot run `audit` is
      # missing the one command that survives an origin compromise.
      - name: Build
        run: cargo build --release --locked --features audit --target ${{ matrix.target }}

      # Cheap smoke test. A binary that cannot sign and verify its own output has
      # no business being published, and cross-compiled targets are exactly where
      # that goes wrong silently.
      #
      # Skipped for x86_64-apple-darwin alone: `macos-latest` is arm64, so that one
      # target is the only cross-compile in the matrix that the runner cannot
      # execute natively. Every other target, including aarch64 Linux, runs on
      # hardware of its own architecture.
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          set -eux
          BIN=target/${{ matrix.target }}/release/veil-guard
          [ -f "$BIN" ] || BIN="$BIN.exe"
          mkdir -p smoke/dist
          printf 'export const x = 1;\n' > smoke/dist/app.js
          "$BIN" keygen --out-dir smoke/keys --name a
          "$BIN" keygen --out-dir smoke/keys --name b
          "$BIN" trust-root --key smoke/keys/a.pub.json --key smoke/keys/b.pub.json \
            --threshold 2 --out smoke/trust-root.json
          "$BIN" sign --dist smoke/dist --trust-root smoke/trust-root.json \
            --key smoke/keys/a.key.json --key smoke/keys/b.key.json
          "$BIN" verify --dist smoke/dist --trust-root smoke/trust-root.json

      - name: Package
        shell: bash
        run: |
          set -eux
          VERSION="${{ inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"
          NAME="veil-guard-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          if [ -f "target/${{ matrix.target }}/release/veil-guard.exe" ]; then
            cp "target/${{ matrix.target }}/release/veil-guard.exe" "dist/$NAME/"
          else
            cp "target/${{ matrix.target }}/release/veil-guard" "dist/$NAME/"
          fi
          cp README.md SPEC.md LICENSE-MIT LICENSE-APACHE "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          # Written next to the archive so the wrapper can check what it downloaded
          # before executing it. macOS ships `shasum` and no `sha256sum`; Linux and
          # Git Bash on Windows are the other way round. Same output format either way.
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          else
            shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # One checksum file covering every target, so a verifier needs a single
      # trusted value rather than one per platform.
      - name: Collect checksums
        run: |
          set -eux
          cd artifacts
          cat *.sha256 | sort -k2 > SHA256SUMS
          rm -f *.sha256
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
