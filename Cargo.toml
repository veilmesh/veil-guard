[package]
name = "veil-guard"
version = "0.1.0"
edition = "2021"
authors = ["VeilMesh Team <dev@veilmesh.com>"]
description = "Web asset integrity and attestation suite: threshold-signed manifests, SRI/CSP generation, and out-of-band audit"
license = "MIT OR Apache-2.0"

[dependencies]
# Signing and verification — see SPEC.md §2
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1.8", features = ["derive"] }

# Manifest handling. serde's derive rejects duplicate object keys for known fields,
# which is what SPEC.md §6.1 requires of a conforming parser.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Path canonicalization — SPEC.md §7
unicode-normalization = "0.1"
walkdir = "2.5"

hex = "0.4"
clap = { version = "4.5", features = ["derive"] }

[features]
default = []
# The out-of-band auditor (Step 3) pulls a large dependency tree. It is kept off the
# default path so that the signing side stays small enough to review.
audit = []
