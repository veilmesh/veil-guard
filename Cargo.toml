[package]
name = "veil-guard"
version = "0.2.0"
edition = "2021"
authors = ["VeilMesh Team <dev@veilmesh.com>"]
description = "Web asset integrity and attestation suite: threshold-signed manifests, SRI/CSP generation, and out-of-band audit"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/veilmesh/veil-guard"
homepage = "https://veilmesh.com"
documentation = "https://github.com/veilmesh/veil-guard#readme"
keywords = ["security", "zero-trust", "sri", "attestation", "wasm"]
categories = ["command-line-utilities", "web-programming", "cryptography"]

[dependencies]
# Signing and verification — see SPEC.md §2
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1.8", features = ["derive"] }

# Manifest handling. serde's derive rejects duplicate object keys for known fields,
# which is what SPEC.md §6.1 requires of a conforming parser.
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

# Path canonicalization — SPEC.md §7
unicode-normalization = "0.1"
walkdir = "2.5"

hex = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }


# Out-of-band auditor only. Blocking client on purpose: a CLI that probes a few
# dozen URLs has no use for an async runtime.
ureq = { version = "3.3", optional = true }
base64 = { version = "0.22", optional = true }

# KMS dependencies
tokio = { version = "1", features = ["rt", "rt-multi-thread", "signal", "macros", "time"], optional = true }

aws-config = { version = "1.1", features = ["behavior-version-latest"], optional = true }
aws-sdk-kms = { version = "1.1", optional = true }
google-cloud-kms = { version = "0.5", optional = true }
google-cloud-googleapis = { version = "0.15", optional = true }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
tower-http = { version = "0.6", features = ["cors", "limit"], optional = true }

[features]
default = []
# The auditor reaches the network, so it is kept off the default path: the signing
# side stays small enough to review, and nothing that signs can also fetch.
audit = ["dep:ureq", "dep:tokio", "dep:reqwest"]

# KMS support is optional and brings in async dependencies and SDKs.
kms = [
    "dep:tokio",
    "dep:aws-config",
    "dep:aws-sdk-kms",
    "dep:google-cloud-kms",
    "dep:google-cloud-googleapis"
]
vault = ["dep:ureq", "dep:base64"]
rekor = ["dep:ureq", "dep:base64"]
relay-client = ["dep:ureq"]
relay-server = ["dep:axum", "dep:tokio"]
telemetry-server = ["dep:axum", "dep:tokio", "dep:tower-http", "dep:reqwest", "dep:base64"]

[[bin]]
name = "veil-guard"
path = "src/main.rs"

[[bin]]
name = "veil-guard-relay"
path = "relay-server/src/main.rs"
required-features = ["relay-server"]

[[bin]]
name = "veil-guard-telemetry"
path = "src/bin/veil-guard-telemetry.rs"
required-features = ["telemetry-server"]

[dependencies.axum]
version = "0.7"
optional = true





